<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Shri Hanuman Chalisa">
  <!-- Original mark: the sun (भानु) that child Hanuman leapt for, with his gada
       in front. "जुग सहस्र जोजन पर भानू। लील्यो ताहि मधुर फल जानू॥" -->
  <defs>
    <radialGradient id="hc-sun" cx="50%" cy="40%" r="62%">
      <stop offset="0" stop-color="#FFDC8F"/>
      <stop offset="0.45" stop-color="#F4A23A"/>
      <stop offset="1" stop-color="#D6441C"/>
    </radialGradient>
    <linearGradient id="hc-gada" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E1C0F"/>
      <stop offset="1" stop-color="#260B06"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="178" fill="url(#hc-sun)"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#FFE7B0" stroke-opacity="0.4" stroke-width="4"/>
  <g fill="url(#hc-gada)">
    <!-- kalash-like head with a pointed crown -->
    <circle cx="256" cy="98" r="10"/>
    <path d="M256 104 C 300 132 340 166 336 214 C 333 256 299 284 256 288 C 213 284 179 256 176 214 C 172 166 212 132 256 104 Z"/>
    <!-- collar, shaft, grip rings, pommel -->
    <rect x="218" y="284" width="76" height="20" rx="10"/>
    <rect x="240" y="298" width="32" height="96" rx="13"/>
    <rect x="232" y="336" width="48" height="11" rx="5.5"/>
    <rect x="232" y="358" width="48" height="11" rx="5.5"/>
    <circle cx="256" cy="404" r="20"/>
  </g>
  <!-- ornament: a band at the widest point and ribs, lit by the sun -->
  <g fill="none" stroke="#F2AE48" stroke-linecap="round">
    <path d="M182 214 Q256 238 330 214" stroke-width="9" stroke-opacity="0.9"/>
    <path d="M224 136 Q204 200 222 272" stroke-width="6" stroke-opacity="0.6"/>
    <path d="M256 118 V282" stroke-width="6" stroke-opacity="0.6"/>
    <path d="M288 136 Q308 200 290 272" stroke-width="6" stroke-opacity="0.6"/>
  </g>
</svg>
