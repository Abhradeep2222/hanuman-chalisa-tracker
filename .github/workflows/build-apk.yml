name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: |
          node scripts/build-web.js
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HanumanChalisa-v1.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HanumanChalisa-APK
          path: HanumanChalisa-v1.3.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.3.0
          name: "Shri Hanuman Chalisa Android App v1.3.0 (Multilingual AI Voice Sync & Acoustic VAD Fixed)"
          body: |
            ## 🕉️ Shri Hanuman Chalisa Android APK v1.3.0
            
            ### 🌟 Major AI Voice Sync & Multilingual Fixes:
            - **Multilingual Cross-Script Speech Recognition:** Fixed critical bug where Bengali and English chanting failed to match Devanagari tokens. Now utilizes multi-script `phoneticSkeleton` normalization for Bengali (`বাংলা`), Hindi (`हिन्दी`), and English transliteration.
            - **Capacitor Native Android Speech Bridge:** Wired `@capacitor-community/speech-recognition` into Android APK with native runtime permission checks.
            - **Acoustic Voice Activity Detection (VAD):** Integrated real-time RMS voice cadence tracker via Web Audio API, ensuring live microphone chanting pulses and advances word-by-word even in offline environments.
            - **Soulful Devotional Audio Track:** Embedded authentic Hariharan Ji Shri Hanuman Chalisa recitation with calibrated word-by-word karaoke synchronization.
            - **Redesigned Mobile-First Sacred Temple UI:** 100% responsive on all mobile screens with zero overflow.

            ### 📲 How to Install:
            1. Download `HanumanChalisa-v1.3.apk` below directly to your Android smartphone.
            2. Open the downloaded file to install/update the app.
            3. Enjoy full offline devotional chanting on your mobile without needing any laptop!
          files: HanumanChalisa-v1.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
