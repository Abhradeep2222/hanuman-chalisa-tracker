name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: |
          node scripts/build-web.js
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HanumanChalisa-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HanumanChalisa-APK
          path: HanumanChalisa-v1.0.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "Shri Hanuman Chalisa Android App v1.0.0"
          body: |
            ## 🕉️ Shri Hanuman Chalisa Android APK
            
            Authentic, offline-first devotional Android application with real-time AI speech synchronization, karaoke glow, pronunciation accuracy scoring, and multilingual verse meanings (हिन्दी, বাংলা, English).

            ### 📲 How to Install:
            1. Download `HanumanChalisa-v1.0.apk` below directly onto your Android phone.
            2. Tap the downloaded file to install. (If prompted, allow "Install unknown apps" for your browser).
            3. Open and chant with full devotion! Works 100% offline without requiring any laptop.
          files: HanumanChalisa-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
