name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: |
          node scripts/build-web.js
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HanumanChalisa-v1.1.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HanumanChalisa-APK
          path: HanumanChalisa-v1.1.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.1.0
          name: "Shri Hanuman Chalisa Android App v1.1.0 (Sound Fixed)"
          body: |
            ## 🕉️ Shri Hanuman Chalisa Android APK v1.1.0
            
            ### 🔊 Sound & Voice Improvements in this Release:
            - **Native Android Text-To-Speech:** Native Google TTS engine integration speaks authentic Hindi, Bengali, or English without WebView audio silence.
            - **Android 11-15 Queries Permission:** Fixed Android package visibility restriction so Google TTS and Google Speech Recognition engines are discoverable by the app.
            - **AudioContext Singleton:** Resolved hardware context limit (6 max) that previously caused audio dropouts on mobile.
            - **Resonant Temple Bell Chime:** Replaced electronic beeps with sacred bronze temple bell harmonics.

            ### 📲 How to Install:
            1. Download `HanumanChalisa-v1.1.apk` below directly onto your Android phone.
            2. Tap the downloaded file to install (select "Update" or "Install").
            3. Open and chant with full devotion! Works 100% offline without requiring any laptop.
          files: HanumanChalisa-v1.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
