name: Build Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: |
          node scripts/build-web.js
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HanumanChalisa-v1.2.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HanumanChalisa-APK
          path: HanumanChalisa-v1.2.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.2.0
          name: "Shri Hanuman Chalisa Android App v1.2.0 (Divine Audio & Redesigned Mobile UI)"
          body: |
            ## 🕉️ Shri Hanuman Chalisa Android APK v1.2.0
            
            ### 🌟 Major Sound & Mobile Redesign Improvements:
            - **Soulful Devotional Audio Track:** Embedded authentic Hariharan Ji Shri Hanuman Chalisa recitation inside the APK assets for 100% offline playback on all Android phones without TTS dependency.
            - **Word-by-Word Radiant Gold Karaoke Glow:** Calibrated timestamps for all 43 verses with real-time glowing word illumination as the audio recites.
            - **Redesigned Mobile-First Sacred Temple UI:** Luxury Obsidian & Saffron Amber aesthetics, perfectly responsive across all mobile screens (320px - 480px) and desktops with zero overflow.
            - **Segmented 3 Sacred Modes:**
              - 🎵 **Divine Audio:** Listen & Learn with authentic recitation, scrubber slider, speed control (0.75x, 1.0x, 1.25x), and loop option.
              - 🎙️ **AI Voice Sync:** Real-time microphone chanting tracker with live audio waveform bars and sacred accuracy scoring.
              - 👆 **Tap Sync:** Meditative silent chanting counter with haptic vibration.
            - **Sankalpa Mala Goals:** Track 1x, 7x, 11x, 21x, or 108x Maha Mala chanting.
            - **Multilingual Support:** Complete Hindi, Bengali, and English transliterations and authentic verse-by-verse meanings.

            ### 📲 How to Install:
            1. Download `HanumanChalisa-v1.2.apk` below directly to your Android smartphone.
            2. Open the downloaded file to install/update the app.
            3. Enjoy full offline devotional chanting on your mobile without needing any laptop!
          files: HanumanChalisa-v1.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
